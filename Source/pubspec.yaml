version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  get: ^4.7.2
  intl: ^0.20.2
  webviewx_plus: ^0.5.1+1
  url_launcher: ^6.3.2
  carousel_slider: ^5.1.1
